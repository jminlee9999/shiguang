<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4eee3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="拾光">
  <meta name="format-detection" content="telephone=no">
  <title>拾光 · 我的备忘录</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-plan" viewBox="0 0 24 24">
      <rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect>
      <path d="M8 3v4M16 3v4M3.5 9.5h17M9 14.5l2 2 4-4"></path>
    </symbol>
    <symbol id="i-done" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5"></circle>
      <path d="m8.5 12 2.4 2.4 4.6-5"></path>
    </symbol>
    <symbol id="i-daily" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3.8"></circle>
      <path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5l1.5 1.5M17 17l1.5 1.5M18.5 5.5 17 7M7 17l-1.5 1.5"></path>
    </symbol>
    <symbol id="i-goods" viewBox="0 0 24 24">
      <path d="m12 3.2 1.9 5.1 5.1 1.9-5.1 1.9L12 17.2l-1.9-5.1L5 10.2l5.1-1.9z"></path>
      <path d="M18.6 15.5v4.2M16.5 17.6h4.2"></path>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"></path>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="6.5"></circle>
      <path d="m16 16 4.2 4.2"></path>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path d="m6 6 12 12M18 6 6 18"></path>
    </symbol>
    <symbol id="i-edit" viewBox="0 0 24 24">
      <path d="M4 20h4.2L19 9.2a2.3 2.3 0 0 0 0-3.2l-1-1a2.3 2.3 0 0 0-3.2 0L4 15.8z"></path>
      <path d="m13.5 6.5 4 4"></path>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M4.5 7h15M9.5 7V4.8h5V7M6.5 7l.8 12.2a1.8 1.8 0 0 0 1.8 1.6h5.8a1.8 1.8 0 0 0 1.8-1.6L17.5 7"></path>
      <path d="M10 11v5.5M14 11v5.5"></path>
    </symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24">
      <rect x="3.8" y="5.2" width="16.4" height="15" rx="2.8"></rect>
      <path d="M8 3v4M16 3v4M3.8 9.6h16.4"></path>
    </symbol>
    <symbol id="i-image" viewBox="0 0 24 24">
      <rect x="3.2" y="4.5" width="17.6" height="15" rx="2.8"></rect>
      <circle cx="8.6" cy="9.8" r="1.5"></circle>
      <path d="m4.5 17 4.4-4.5 3.3 3.2 2.6-2.4 4.7 4.2"></path>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="m5 12.5 4.4 4.4L19 6.8"></path>
    </symbol>
    <symbol id="i-undo" viewBox="0 0 24 24">
      <path d="M4 8.5h9.5a5.5 5.5 0 1 1 0 11H8"></path>
      <path d="m7.8 4.4-4 4.1 4 4"></path>
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24">
      <path d="M12 3.5v11M7.5 10.5 12 15l4.5-4.5M4.5 19.5h15"></path>
    </symbol>
    <symbol id="i-upload" viewBox="0 0 24 24">
      <path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4.5 19.5h15"></path>
    </symbol>
    <symbol id="i-left" viewBox="0 0 24 24">
      <path d="m14.5 5-7 7 7 7"></path>
    </symbol>
    <symbol id="i-right" viewBox="0 0 24 24">
      <path d="m9.5 5 7 7-7 7"></path>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5"></circle>
      <path d="M12 7.5V12l3 2"></path>
    </symbol>
    <symbol id="i-quote" viewBox="0 0 24 24">
      <path d="M9.5 6.5c-3 1.6-4.6 4.1-4.6 7.5 0 2.4 1.3 3.7 3.1 3.7 1.8 0 3-1.2 3-3 0-1.6-1.1-2.8-2.6-2.8-.3 0-.6 0-.8.1.4-1.7 1.6-3.1 3.5-4.2zM19 6.5c-3 1.6-4.6 4.1-4.6 7.5 0 2.4 1.3 3.7 3.1 3.7 1.8 0 3-1.2 3-3 0-1.6-1.1-2.8-2.6-2.8-.3 0-.6 0-.8.1.4-1.7 1.6-3.1 3.5-4.2z"></path>
    </symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24">
      <path d="M4 12h15M14 7l5 5-5 5"></path>
    </symbol>
  </svg>

  <div class="boot" id="boot">
    <div class="boot-stamp">记</div>
    <p>正在打开备忘录…</p>
  </div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-stamp">记</div>
        <div class="brand-text">
          <strong>拾光</strong>
          <span>lq 的备忘录</span>
        </div>
      </div>

      <div class="nav-label">我的备忘</div>
      <nav class="nav" id="nav" aria-label="备忘录分组">
        <button class="nav-item" type="button" data-action="nav" data-section="plan">
          <svg class="icon"><use href="#i-plan"></use></svg>
          <span class="nav-name">计划</span>
          <span class="nav-count" data-count="plan">0</span>
        </button>
        <button class="nav-item" type="button" data-action="nav" data-section="done">
          <svg class="icon"><use href="#i-done"></use></svg>
          <span class="nav-name">已完成</span>
          <span class="nav-count" data-count="done">0</span>
        </button>
        <button class="nav-item" type="button" data-action="nav" data-section="daily">
          <svg class="icon"><use href="#i-daily"></use></svg>
          <span class="nav-name">日常记录</span>
          <span class="nav-count" data-count="daily">0</span>
        </button>
        <button class="nav-item" type="button" data-action="nav" data-section="goods">
          <svg class="icon"><use href="#i-goods"></use></svg>
          <span class="nav-name">好物收藏</span>
          <span class="nav-count" data-count="goods">0</span>
        </button>
      </nav>

      <div class="sidebar-spacer"></div>

      <section class="progress-card" aria-label="计划完成情况">
        <div class="progress-top">
          <span>计划完成率</span>
          <strong id="progressPercent">0%</strong>
        </div>
        <div class="progress-track" id="progressTrack" role="progressbar" aria-label="计划完成率"
          aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <p id="progressHint">从一件小事开始吧。</p>
      </section>

      <div class="sidebar-quote">
        <p>把日子过成自己喜欢的样子，<br>从记下每一件小事开始。</p>
      </div>

      <div class="sidebar-foot">
        <div class="foot-date" id="sidebarDate"></div>
        <div class="foot-note" id="storageFoot" data-state="local">
          <span class="dot"></span><span id="storageNote">仅保存在这台 iPhone</span>
        </div>
        <div class="foot-actions">
          <button type="button" class="foot-btn" data-action="export">
            <svg class="icon"><use href="#i-download"></use></svg>备份
          </button>
          <button type="button" class="foot-btn" data-action="import">
            <svg class="icon"><use href="#i-upload"></use></svg>恢复
          </button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="main-inner">
        <header class="topbar">
          <div class="page-heading">
            <div class="page-heading-top">
              <div class="eyebrow" id="pageEyebrow">PLAN · 计划清单</div>
              <span class="sync-pill" id="syncPill" data-state="local" role="status"
                title="所有记录只保存在这台 iPhone 上">
                <span class="sync-dot"></span><span id="syncText">仅本机</span>
              </span>
              <button class="data-pill" id="dataButton" type="button" data-action="open-data"
                aria-label="备份与数据">
                <svg class="icon"><use href="#i-download"></use></svg><span>备份</span>
              </button>
            </div>
            <h1 id="pageTitle">计划</h1>
            <p id="pageSub">把想做的事写下来，一件一件去完成。</p>
          </div>
          <div class="topbar-side">
            <div class="today-chip">
              <span class="today-week" id="todayWeek"></span>
              <strong class="today-date" id="todayDate"></strong>
            </div>
            <div class="search-box">
              <svg class="icon"><use href="#i-search"></use></svg>
              <input id="searchInput" type="search" autocomplete="off" placeholder="搜索计划…" aria-label="搜索当前分组">
              <button type="button" class="search-clear" id="searchClear" data-action="clear-search" aria-label="清除搜索" hidden>
                <svg class="icon"><use href="#i-close"></use></svg>
              </button>
            </div>
          </div>
        </header>

        <div class="install-banner" id="installBanner" hidden>
          <div class="install-banner-mark">记</div>
          <div class="install-banner-text">
            <strong>把它装进 iPhone 主屏幕</strong>
            <span>用 Safari 打开后，点「分享」→「添加到主屏幕」。</span>
          </div>
          <button class="install-banner-close" type="button" data-action="dismiss-install" aria-label="不再提示">
            <svg class="icon"><use href="#i-close"></use></svg>
          </button>
        </div>

        <div id="composerMount"></div>
        <section id="content" class="content" aria-live="polite"></section>
      </div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>

  <input type="file" id="importInput" accept="application/json,.json" hidden>
  <input type="file" id="imageInput" accept="image/*" multiple hidden>

  <script src="app.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
